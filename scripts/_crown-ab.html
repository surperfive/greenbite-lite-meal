<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>皇冠 TY 四档 A/B</title>
<style>
  html,body{margin:0;background:#F4F6F8;font:12px/1 "Microsoft YaHei",sans-serif}
  svg{display:block}
  .t { font-family: "PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","Heiti SC","WenQuanYi Micro Hei",system-ui,sans-serif; fill:#000; }
  .t-h { font-weight: 900; }
  .t-w { fill:#FFFFFF; }
  .row{position:relative;display:flex;align-items:center;gap:10px;padding:6px 10px}
  .tag{width:150px;font-size:13px;color:#333;font-family:ui-monospace,monospace}
  .badge{width:360px;height:160px}
</style>
</head>
<body>
<!-- 每行一个候选 translateY；其余几何完全一致。viewBox 620,10 180x80 ⇒ 1u = 2px -->
<template id="tpl">
  <svg viewBox="620 10 180 80" width="360" height="160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="G" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0" stop-color="#FC5294" /><stop offset="1" stop-color="#FC5294" />
      </linearGradient>
    </defs>
    <rect x="628.5" y="16" width="164" height="65" rx="32.5" fill="#FFFFFF" />
    <path d="M658,22 H763 A23.5,23.5 0 0 1 763,69 H686 L668,75 L678,69 H658 A23.5,23.5 0 0 1 658,22 Z"
          fill="url(#G)" stroke-linejoin="round" />
    <g class="crown" transform="translate(663.1,44) scale(0.66)">
      <path d="M-16,10 L-16,-6 L-9,0 L0,-12 L9,0 L16,-6 L16,10 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    </g>
    <text class="t t-w t-h" x="682.1" y="56.3" font-size="24" letter-spacing="0">9折限时</text>
  </svg>
</template>
<script>
const cases = [
  [44.0, 'A: TY=44.0 旧值(质心→45.74理论)'],
  [45.4, 'B: TY=45.4 质心→46.9实测'],
  [46.4, 'C: TY=46.4 当前(bbox→45.74理论)'],
  [47.8, 'D: TY=47.8 bbox→47.13实测'],
];
const tpl = document.getElementById('tpl');
for (const [ty, label] of cases) {
  const row = document.createElement('div');
  row.className = 'row';
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = label;
  const node = tpl.content.cloneNode(true);
  node.querySelector('.crown').setAttribute('transform', `translate(663.1,${ty}) scale(0.66)`);
  row.appendChild(tag);
  row.appendChild(node);
  document.body.appendChild(row);
}
</script>
</body>
</html>
