<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>白边方案 A/B：描边法 vs 双路径外扩</title>
<style>
  html,body{margin:0;background:#F4F6F8}
  svg{display:block}
  .t{font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","Heiti SC",system-ui,sans-serif;fill:#000}
  .t-h{font-weight:900}.t-w{fill:#FFF}
  .row{display:flex;align-items:center;gap:12px;padding:8px 12px}
  .tag{width:250px;font:12px/1.5 ui-monospace,monospace;color:#222}
</style>
</head>
<body>
<script>
const B = { x0: 634.5, y0: 22, x1: 786.5, y1: 69, rx: 16 };

/* 气泡路径：L/R 为尾巴底边两端，T 为尖端，curve 控制右缘是否走贝塞尔 */
function bubblePath({ L, R, T, curve, tipRound }) {
  const b = B, y1 = b.y1;
  const p = [
    `M ${b.x0 + b.rx},${b.y0}`,
    `H ${b.x1 - b.rx}`,
    `A ${b.rx},${b.rx} 0 0 1 ${b.x1},${b.y0 + b.rx}`,
    `V ${b.y1 - b.rx}`,
    `A ${b.rx},${b.rx} 0 0 1 ${b.x1 - b.rx},${b.y1}`,
    `H ${R}`,
  ];
  // 右缘
  if (curve) p.push(`C ${R - 9},${y1} ${T[0] + 13},${(y1 + T[1]) / 2} ${T[0]},${T[1]}`);
  else p.push(`L ${T[0]},${T[1]}`);
  // 尖端倒圆（可选）：让描边 round join 有对应的圆角半径
  if (tipRound) p.push(`A ${tipRound},${tipRound} 0 0 0 ${T[0] + tipRound * 1.2},${T[1] - tipRound * 0.9}`);
  p.push(`L ${L},${y1}`);
  p.push(`H ${b.x0 + b.rx}`);
  p.push(`A ${b.rx},${b.rx} 0 0 1 ${b.x0},${b.y1 - b.rx}`);
  p.push(`V ${b.y0 + b.rx}`);
  p.push(`A ${b.rx},${b.rx} 0 0 1 ${b.x0 + b.rx},${b.y0}`);
  p.push('Z');
  return p.join(' ');
}

const GEOM = { L: 672, R: 696, T: [668, 81] };

const CASES = [
  { k: 'G1', mode: 'stroke', geom: { L: 672, R: 696, T: [668, 84], curve: true }, label: 'D14 深14' },
  { k: 'G2', mode: 'stroke', geom: { L: 672, R: 698, T: [668, 87], curve: true }, label: 'D17 深17' },
  { k: 'G3', mode: 'stroke', geom: { L: 674, R: 700, T: [670, 90], curve: true }, label: 'D20 深20' },
  { k: 'G4', mode: 'stroke', geom: { L: 676, R: 704, T: [672, 93], curve: true }, label: 'D23 深23' },
];

const NS = 'http://www.w3.org/2000/svg';
for (const c of CASES) {
  const row = document.createElement('div');
  row.className = 'row';
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = c.label;
  row.appendChild(tag);

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '615 4 195 96');
  svg.setAttribute('width', '620');
  svg.setAttribute('height', '305');
  svg.dataset.k = c.k;

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = `<linearGradient id="g${c.k}" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#FC5294"/><stop offset="1" stop-color="#FC5294"/></linearGradient>`;
  svg.appendChild(defs);

  const d = bubblePath(c.geom);

  if (c.mode === 'stroke') {
    const w = document.createElementNS(NS, 'path');
    w.setAttribute('d', d);
    w.setAttribute('fill', '#FFFFFF');
    w.setAttribute('stroke', '#FFFFFF');
    w.setAttribute('stroke-width', '12');
    w.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(w);
  } else {
    // 旧的粗糙做法：整体平移扩 6
    const O = { x0: 628.5, y0: 16, x1: 792.5, y1: 75, rx: 22 };
    const saved = { ...B };
    Object.assign(B, O);
    const od = bubblePath({ ...c.geom, L: c.geom.L - 6, R: c.geom.R + 6, T: [c.geom.T[0] - 6, c.geom.T[1] + 6] });
    Object.assign(B, saved);
    const w = document.createElementNS(NS, 'path');
    w.setAttribute('d', od);
    w.setAttribute('fill', '#FFFFFF');
    svg.appendChild(w);
  }

  const f = document.createElementNS(NS, 'path');
  f.setAttribute('d', d);
  f.setAttribute('fill', `url(#g${c.k})`);
  svg.appendChild(f);

  const crown = document.createElementNS(NS, 'g');
  crown.setAttribute('transform', 'translate(663.1,47.4) scale(0.66)');
  crown.innerHTML = '<path d="M-16,10 L-16,-6 L-9,0 L0,-12 L9,0 L16,-6 L16,10 Z" fill="#FFF" stroke="#FFF" stroke-width="2" stroke-linejoin="round"/>';
  svg.appendChild(crown);

  const txt = document.createElementNS(NS, 'text');
  txt.setAttribute('class', 't t-w t-h');
  txt.setAttribute('x', '682.1'); txt.setAttribute('y', '56.3');
  txt.setAttribute('font-size', '24');
  txt.textContent = '9折限时';
  svg.appendChild(txt);

  row.appendChild(svg);
  document.body.appendChild(row);
}
</script>
</body>
</html>
